[project]
name = "kgat-music-recommender"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "torch-geometric>=2.5",
    "pyg-lib",
    "pandas>=2.0",
    "numpy>=1.24",
    "requests",
    "SPARQLWrapper>=2.0",
    "streamlit>=1.30",
    "pyvis>=0.3",
    "networkx>=3.0",
    "scikit-learn>=1.3",
    "tqdm",
]

[project.optional-dependencies]
dev = ["ipython", "matplotlib", "jupyter"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
