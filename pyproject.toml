[project]
name = "kgat-music-recommender"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "torch-geometric>=2.5",
    "pandas>=2.0",
    "numpy>=1.24",
    "streamlit>=1.30",
    "pyvis>=0.3",
    "dotenv"
]

# pyg-lib / torch-sparse are NOT listed here. They are PyG sampler backends
# distributed as platform-specific wheels keyed on torch + CUDA build. Install
# the one matching your torch via:
#   pip install pyg-lib torch-sparse -f https://data.pyg.org/whl/torch-<X.Y.Z>+<cpu|cuXXX>.html
# See README.md for details and Blackwell-era CUDA notes.

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
